# Continuous integration for the Online Election System.
#
# This workflow mirrors the local commands in README.md. It was written together with the
# project but has NOT been executed on GitHub: the repository has not been pushed anywhere.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit and integration tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, component, integration, security, concurrency and property tests
        run: ./mvnw -B -ntp clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-suite-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  browser-tests:
    name: Browser system tests (headless Chrome)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub's Ubuntu runners ship Google Chrome; Selenium Manager downloads the matching driver.
      - name: Show Chrome version
        run: google-chrome --version
      - name: Selenium system tests
        run: ./mvnw -B -ntp -Psystem verify
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-suite-reports
          path: target/failsafe-reports/

  mutation-analysis:
    name: Mutation analysis (PIT)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PIT on the policy package
        run: ./mvnw -B -ntp -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/

  load-smoke:
    name: Load smoke test (manual trigger only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Local HTTP load smoke test
        run: ./mvnw -B -ntp -Pperformance verify
      - name: Upload load smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-report
          path: target/performance/
