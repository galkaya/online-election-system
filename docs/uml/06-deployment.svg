<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-label="Deployment diagram: local demo">
<title>Deployment diagram: local demo</title>
<defs>
<marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#111" stroke-width="1.2"/></marker>
<marker id="solid" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#111"/></marker>
<marker id="hollow" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1,1 L15,7 L1,13 Z" fill="#fff" stroke="#111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<path d="M30,40 l12,-10 h1060 v490 l-12,10" fill="#dfe6f7" stroke="#111"/>
<rect x="30" y="40" width="1060" height="490" stroke="#111" fill="#eef2ff"/>
<text x="40" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#111">«device»  Demo laptop</text>
