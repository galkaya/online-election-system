<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-label="State diagram: election life cycle">
<title>State diagram: election life cycle</title>
<defs>
<marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#111" stroke-width="1.2"/></marker>
<marker id="solid" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#111"/></marker>
<marker id="hollow" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1,1 L15,7 L1,13 Z" fill="#fff" stroke="#111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<circle cx="62" cy="90" r="11" fill="#111"/>
<rect x="160" y="60" width="150" height="60" stroke="#111" rx="16" fill="#fff"/>
<text x="235" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">DRAFT</text>
<rect x="470" y="60" width="150" height="60" stroke="#111" rx="16" fill="#fff"/>
<text x="545" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">OPEN</text>
<rect x="800" y="60" width="150" height="60" stroke="#111" rx="16" fill="#fff"/>
<text x="875" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">CLOSED</text>
<circle cx="1022" cy="90" r="11" fill="#fff" stroke="#111"/><circle cx="1022" cy="90" r="7" fill="#111"/>
<path d="M90,200 h276 l14,14 v86 h-290 Z" fill="#fff8dc" stroke="#111"/>
<text x="98" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Title, schedule and candidates can change.</text>
<text x="98" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Eligibility can change.</text>
<text x="98" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Not visible to voters. No votes.</text>
<text x="98" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Activation needs: at least 2 candidates,</text>
<text x="98" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">valid window, now &lt; endsAt.</text>
<path d="M410,200 h286 l14,14 v116 h-300 Z" fill="#fff8dc" stroke="#111"/>
<text x="418" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Setup is locked. Phase by the server clock:</text>
<text x="418" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">now &lt; startsAt: &quot;Not started&quot;, no votes</text>
<text x="418" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">startsAt &lt;= now &lt; endsAt: &quot;Voting open&quot;</text>
<text x="418" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">now &gt;= endsAt: &quot;Voting ended&quot;, no votes,</text>
<text x="418" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">results are shown</text>
<text x="418" y="293" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Eligibility can change until voting is over.</text>
<path d="M740,200 h276 l14,14 v66 h-290 Z" fill="#fff8dc" stroke="#111"/>
<text x="748" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Final: never reopened.</text>
<text x="748" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">No votes. Results are shown.</text>
<text x="748" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Eligibility is frozen.</text>
<line x1="74" y1="90" x2="160" y2="90" stroke="#111" marker-end="url(#open)"/>
<text x="117" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">create</text>
<line x1="310" y1="90" x2="470" y2="90" stroke="#111" marker-end="url(#open)"/>
<text x="390" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">activate</text>
<text x="390" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">(administrator)</text>
<line x1="620" y1="90" x2="800" y2="90" stroke="#111" marker-end="url(#open)"/>
<text x="710" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">close</text>
<text x="710" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">(administrator)</text>
<line x1="950" y1="90" x2="1010" y2="90" stroke="#111" marker-end="url(#open)"/>
<line x1="235" y1="200" x2="235" y2="120" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<line x1="554.4" y1="200" x2="547.6" y2="120" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<line x1="882.3" y1="200" x2="877" y2="120" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
</svg>
