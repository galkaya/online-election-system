<path d="M40,560 h416 l14,14 v86 h-430 Z" fill="#fff8dc" stroke="#111"/>
<text x="48" y="578" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Ballot has no association to UserAccount or Participation</text>
<text x="48" y="593" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">and no timestamp. It stores only the SHA-256 hash of the</text>
<text x="48" y="608" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">confirmation code. Participation stores who voted, never</text>
<text x="48" y="623" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">for whom. Unique (electionId, voterId) is the one-vote rule.</text>
<path d="M900,550 h266 l14,14 v66 h-280 Z" fill="#fff8dc" stroke="#111"/>
<text x="908" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">AuditEvent never stores a candidate,</text>
<text x="908" y="583" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">a ballot id or a confirmation code.</text>
<text x="908" y="598" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Accepted votes create no AuditEvent.</text>
