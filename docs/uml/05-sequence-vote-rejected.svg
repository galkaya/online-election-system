<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-label="Sequence diagram: a duplicate vote is rejected">
<title>Sequence diagram: a duplicate vote is rejected</title>
<defs>
<marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#111" stroke-width="1.2"/></marker>
<marker id="solid" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#111"/></marker>
<marker id="hollow" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1,1 L15,7 L1,13 Z" fill="#fff" stroke="#111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="105" y1="70" x2="105" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="105" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">Voter (browser)</text>
<rect x="210" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="285" y1="70" x2="285" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="285" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">VoterController</text>
<rect x="390" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="465" y1="70" x2="465" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="465" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">VotingService</text>
<rect x="570" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="645" y1="70" x2="645" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="645" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">VoteTransaction</text>
<rect x="750" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="825" y1="70" x2="825" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="825" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">VotingPolicy</text>
<rect x="930" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="1005" y1="70" x2="1005" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="1005" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">H2 database</text>
<rect x="1110" y="30" width="150" height="40" fill="#f5f7fb" stroke="#111"/>
<line x1="1185" y1="70" x2="1185" y2="630" stroke="#555" stroke-dasharray="6 4"/>
<text x="1185" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111">AuditService</text>
<path d="M390,650 h506 l14,14 v36 h-520 Z" fill="#fff8dc" stroke="#111"/>
<text x="398" y="668" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">If the audit insert fails, the failure is logged and the rejection is still returned.</text>
<text x="398" y="683" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">A broken audit log can never turn a rejected vote into an accepted one.</text>
<line x1="105" y1="120" x2="285" y2="120" stroke="#111" marker-end="url(#solid)"/>
<text x="195" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">POST /voter/elections/{id}/vote</text>
<text x="195" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">(candidateId, CSRF token)</text>
<line x1="285" y1="160" x2="465" y2="160" stroke="#111" marker-end="url(#solid)"/>
<text x="375" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">castVote(principal, election, candidate)</text>
<line x1="465" y1="200" x2="645" y2="200" stroke="#111" marker-end="url(#solid)"/>
<text x="555" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">castVote(...)  [transaction 1 begins]</text>
<line x1="645" y1="240" x2="1005" y2="240" stroke="#111" marker-end="url(#solid)"/>
<text x="825" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">SELECT election FOR UPDATE  (lock 1)</text>
<line x1="645" y1="280" x2="1005" y2="280" stroke="#111" marker-end="url(#solid)"/>
<text x="825" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">SELECT voter account FOR UPDATE  (lock 2)</text>
<line x1="645" y1="320" x2="1005" y2="320" stroke="#111" marker-end="url(#solid)"/>
<text x="825" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">participation exists? yes</text>
<line x1="645" y1="360" x2="825" y2="360" stroke="#111" marker-end="url(#solid)"/>
<text x="735" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">evaluate(VoteContext)</text>
<line x1="825" y1="400" x2="645" y2="400" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="735" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">ALREADY_VOTED</text>
<line x1="645" y1="440" x2="465" y2="440" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="555" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">VoteRejectedException  [transaction 1 rolls back]</text>
<line x1="465" y1="480" x2="1185" y2="480" stroke="#111" marker-end="url(#solid)"/>
<text x="825" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">recordRejection(account, election, reason)  [transaction 2: REQUIRES_NEW]</text>
<line x1="1185" y1="520" x2="1005" y2="520" stroke="#111" marker-end="url(#solid)"/>
<text x="1095" y="514" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">INSERT audit_event  [commit]</text>
<line x1="1185" y1="555" x2="465" y2="555" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="825" y="549" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">done</text>
<line x1="465" y1="590" x2="285" y2="590" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="375" y="584" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">VoteRejectedException</text>
<line x1="285" y1="630" x2="105" y2="630" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="195" y="609" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">409 page: You have already voted</text>
<text x="195" y="624" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">in this election.</text>
</svg>
