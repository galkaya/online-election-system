<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Use-case diagram: Online Election System">
<title>Use-case diagram: Online Election System</title>
<defs>
<marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#111" stroke-width="1.2"/></marker>
<marker id="solid" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9 Z" fill="#111"/></marker>
<marker id="hollow" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1,1 L15,7 L1,13 Z" fill="#fff" stroke="#111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="230" y="20" width="900" height="760" stroke="#111" fill="none"/>
<text x="240" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Online Election System</text>
<g stroke="#111" fill="none" stroke-width="1.4"><circle cx="100" cy="355" r="9" fill="#fff"/><line x1="100" y1="364" x2="100" y2="391" stroke="#111"/><line x1="84" y1="373" x2="116" y2="373" stroke="#111"/><line x1="100" y1="391" x2="86" y2="413" stroke="#111"/><line x1="100" y1="391" x2="114" y2="413" stroke="#111"/></g>
<text x="100" y="431" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Voter</text>
<g stroke="#111" fill="none" stroke-width="1.4"><circle cx="100" cy="640" r="9" fill="#fff"/><line x1="100" y1="649" x2="100" y2="676" stroke="#111"/><line x1="84" y1="658" x2="116" y2="658" stroke="#111"/><line x1="100" y1="676" x2="86" y2="698" stroke="#111"/><line x1="100" y1="676" x2="114" y2="698" stroke="#111"/></g>
<text x="100" y="716" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Anonymous visitor</text>
<g stroke="#111" fill="none" stroke-width="1.4"><circle cx="1310" cy="375" r="9" fill="#fff"/><line x1="1310" y1="384" x2="1310" y2="411" stroke="#111"/><line x1="1294" y1="393" x2="1326" y2="393" stroke="#111"/><line x1="1310" y1="411" x2="1296" y2="433" stroke="#111"/><line x1="1310" y1="411" x2="1324" y2="433" stroke="#111"/></g>
<text x="1310" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Administrator</text>
<ellipse cx="640" cy="82" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="640" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Sign in and sign out</text>
<ellipse cx="370" cy="322" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="370" y="318.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">See my elections and</text>
<text x="370" y="333.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">participation status</text>
<ellipse cx="370" cy="402" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="370" y="406" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Vote for one candidate</text>
<ellipse cx="370" cy="462" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="370" y="458.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Receive confirmation</text>
<text x="370" y="473.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">code (shown once)</text>
<ellipse cx="370" cy="662" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="370" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Verify a confirmation code</text>
<ellipse cx="640" cy="402" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="640" y="398.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Check eligibility and</text>
<text x="640" y="413.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">voting window</text>
<ellipse cx="640" cy="482" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="640" y="478.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Reject invalid or</text>
<text x="640" y="493.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">duplicate vote</text>
<ellipse cx="640" cy="722" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="640" y="718.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">View results after</text>
<text x="640" y="733.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">the election has ended</text>
<path d="M530,270 h206 l14,14 v38 h-220 Z" fill="#fff8dc" stroke="#111"/>
<text x="538" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">The server clock decides the</text>
<text x="538" y="303" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">voting window (FR-07).</text>
<ellipse cx="910" cy="140" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Manage voter accounts</text>
<ellipse cx="910" cy="285" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="281.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Create and edit</text>
<text x="910" y="296.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">draft elections</text>
<ellipse cx="910" cy="345" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="349" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Manage candidates</text>
<ellipse cx="910" cy="405" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="409" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Manage voter eligibility</text>
<ellipse cx="910" cy="465" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="469" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Activate election</text>
<ellipse cx="910" cy="525" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="529" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Close election</text>
<ellipse cx="910" cy="660" rx="110" ry="22" fill="#fff" stroke="#111"/>
<text x="910" y="664" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">Review audit log</text>
<line x1="120" y1="369.0" x2="602.5" y2="102.7" stroke="#111"/>
<line x1="120" y1="375.7" x2="295.0" y2="338.1" stroke="#111"/>
<line x1="120" y1="381.6" x2="268.1" y2="393.7" stroke="#111"/>
<line x1="120" y1="392.7" x2="606.9" y2="701.0" stroke="#111"/>
<line x1="120" y1="400.9" x2="349.3" y2="640.4" stroke="#111"/>
<line x1="120" y1="664.8" x2="260.2" y2="663.2" stroke="#111"/>
<line x1="1290" y1="390.5" x2="682.7" y2="102.3" stroke="#111"/>
<line x1="1290" y1="387" x2="942.3" y2="161.0" stroke="#111"/>
<line x1="1290" y1="394.3" x2="972.8" y2="303.1" stroke="#111"/>
<line x1="1290" y1="397.3" x2="1000.6" y2="357.5" stroke="#111"/>
<line x1="1290" y1="400.3" x2="1019.8" y2="403.6" stroke="#111"/>
<line x1="1290" y1="403.3" x2="995.4" y2="451.1" stroke="#111"/>
<line x1="1290" y1="406.3" x2="969.3" y2="506.5" stroke="#111"/>
<line x1="1290" y1="413" x2="942.3" y2="639.0" stroke="#111"/>
<line x1="1290" y1="409.6" x2="682.3" y2="701.7" stroke="#111"/>
<line x1="480" y1="402" x2="530" y2="402" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="505" y="397" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">«include»</text>
<line x1="370" y1="424" x2="370" y2="440" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="370" y="427" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">«include»</text>
<line x1="578.5" y1="463.8" x2="431.5" y2="420.2" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="505" y="437" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">«extend»</text>
<line x1="640" y1="322" x2="640" y2="380" stroke="#111" stroke-dasharray="6 4" marker-end="url(#open)"/>
</svg>
