<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="fields">
    <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" maxlength="120" th:errorclass="input-invalid"
               th:attr="aria-describedby=${#fields.hasErrors('title')} ? 'title-error' : null, aria-invalid=${#fields.hasErrors('title')} ? 'true' : null">
        <p class="field-error" id="title-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</p>
    </div>
    <div class="field">
        <label for="description">Description <span class="optional">(optional)</span></label>
        <textarea id="description" th:field="*{description}" rows="3" maxlength="1000" th:errorclass="input-invalid"
                  th:attr="aria-describedby=${#fields.hasErrors('description')} ? 'description-error' : null, aria-invalid=${#fields.hasErrors('description')} ? 'true' : null"></textarea>
        <p class="field-error" id="description-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p>
    </div>
    <div class="field-row">
        <div class="field">
            <label for="startsAt">Voting opens</label>
            <input type="text" id="startsAt" th:field="*{startsAt}" placeholder="2026-11-19 09:00" inputmode="numeric"
                   th:errorclass="input-invalid"
                   th:attr="aria-describedby=${#fields.hasErrors('startsAt')} ? 'startsAt-hint startsAt-error' : 'startsAt-hint', aria-invalid=${#fields.hasErrors('startsAt')} ? 'true' : null">
            <p class="hint" id="startsAt-hint">Format YYYY-MM-DD HH:MM (24-hour clock),
                <span th:text="${@displayTime.zoneLabel()}">America/Chicago</span> time. Votes are accepted from this minute.</p>
            <p class="field-error" id="startsAt-error" th:if="${#fields.hasErrors('startsAt')}" th:errors="*{startsAt}">Error</p>
        </div>
        <div class="field">
            <label for="endsAt">Voting closes</label>
            <input type="text" id="endsAt" th:field="*{endsAt}" placeholder="2026-11-20 17:00" inputmode="numeric"
                   th:errorclass="input-invalid"
                   th:attr="aria-describedby=${#fields.hasErrors('endsAt')} ? 'endsAt-hint endsAt-error' : 'endsAt-hint', aria-invalid=${#fields.hasErrors('endsAt')} ? 'true' : null">
            <p class="hint" id="endsAt-hint">Same format. A vote arriving at exactly this time is too late.</p>
            <p class="field-error" id="endsAt-error" th:if="${#fields.hasErrors('endsAt')}" th:errors="*{endsAt}">Error</p>
        </div>
    </div>
</th:block>
</body>
</html>
