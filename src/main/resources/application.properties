spring.application.name=online-election-system

# Default profile: an empty in-memory database. Use the "demo" profile for the persistent demo database.
spring.datasource.url=jdbc:h2:mem:election;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20

# The schema is created by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The H2 console stays off in every profile.
spring.h2.console.enabled=false

# English only, regardless of the browser or operating system language.
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# Time zone used to display and enter election times. Storage is always UTC.
election.display-zone=America/Chicago

# Error pages never expose internals.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m

logging.level.root=INFO
logging.level.edu.comp5100.election=INFO
